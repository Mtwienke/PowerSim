[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powersim-research"
version = "0.1.0"
description = "Inspectable quasi-static AC dispatch research sandbox"
requires-python = ">=3.11,<3.15"
dependencies = ["pandapower>=2.14,<4", "pandas>=2", "streamlit>=1.35", "plotly>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["powersim*", "controllers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
