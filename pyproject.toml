[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powersim-research"
version = "0.1.0"
description = "Reproducible DC/AC OPF references and physics-guided learning research"
requires-python = ">=3.11,<3.15"
dependencies = ["pandapower==3.5.6", "pandas>=2", "networkx>=3.6,<4", "streamlit>=1.35", "plotly>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = ["torch>=2.6,<3"]

[project.scripts]
powersim = "powersim.cli:main"

[tool.setuptools.packages.find]
include = ["powersim*", "controllers*"]

[tool.setuptools.package-data]
powersim = ["benchmarks/*.json", "benchmarks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
